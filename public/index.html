<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habla con Culto · Culto Café</title>
<style>
:root{color-scheme:light;--ink:#252d23;--green:#31543c;--paper:#f5efe3;--line:#d9d6c6}*{box-sizing:border-box}body{margin:0;background:#f9f7f0;color:var(--ink);font:16px system-ui,sans-serif}main{width:min(1100px,100%);margin:auto;padding:32px;display:grid;grid-template-columns: 1fr 1.4fr;gap:55px;align-items:center;min-height:100dvh}.brand{color:var(--green);font-weight:800;letter-spacing:.13em;font-size:.78rem;text-transform:uppercase}h1{font:clamp(55px,8vw,100px)/.89 Georgia,serif;letter-spacing:-.075em;margin:18px 0 22px}aside p{max-width:34ch;line-height:1.55}a{color:var(--green)}.chat{height:min(770px,88dvh);min-height:450px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;box-shadow:0 20px 60px #252d2317}header{background:#263c2a;color:#fff;display:flex;gap:12px;align-items:center;padding:14px 17px}header strong,header small{display:block}header small{color:#e5e6cf}.avatar{display:block;width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;background:#f5efe3}button{font:inherit;cursor:pointer}header button{margin-left:auto;border:1px solid #b0bfa9;border-radius:10px;background:none;color:white;padding:6px 10px;font-size:.85rem}#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.bubble{padding:11px 14px;max-width:88%;align-self:flex-start;border-radius:5px 15px 15px 15px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;line-height:1.4}.user{align-self:flex-end;background:#dce9ce;border-radius:15px 5px 15px 15px}.card{background:#fff;border-radius:15px;overflow:hidden;width:min(340px,94%);border:1px solid var(--line)}.card img{width:100%;height:160px;object-fit:cover;display:block}.card div{padding:12px 14px}.card h2{font-size:1rem;margin:0}.card h3{font-size:.85rem;margin:0}.card .card-photo{display:block;margin:0;padding:0 0 5px;text-align:center}.card nav{display:flex;flex-wrap:wrap;gap:4px 14px}.card p{font-size:.85rem;margin:5px 0}.card a{font-size:.85rem;display:inline-block;margin-top:5px;font-weight:700}footer{background:#fffdf8;border-top:1px solid var(--line);padding:10px 14px}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.chips button{white-space:nowrap;background:#f6f4e7;border:1px solid var(--line);color:var(--green);border-radius:20px;padding:6px 10px;font-size:.8rem}form{display:flex;gap:8px}input{min-width:0;flex:1;font:inherit;border:1px solid #b5b8a8;border-radius:12px;background:#fff;padding:10px 12px}form button{border:0;border-radius:12px;padding:0 13px;background:var(--green);color:white}button:disabled{opacity:.6}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #af692d;outline-offset:2px}@media(max-width:740px){main{display:block;padding:12px}aside{padding:4px 5px 12px}h1{font-size:43px;margin:5px 0 8px}aside p{display:none}.chat{height:calc(100dvh - 115px);min-height:340px;border-radius:18px}}
</style></head><body><main>
<aside><span class="brand">Culto Café · Madrid</span><h1>Habla con Culto.</h1><p>Cuéntame qué plan tienes y te ayudo a encontrar tu cafetería en Malasaña.</p><a href="https://micultocafe.netlify.app/#cafeterias" target="_blank" rel="noopener">Explorar las cafeterías ↗</a></aside>
<section class="chat" aria-label="Chat con Culto"><header><img class="avatar" src="./culto-logo.jpg" alt="Logo de Culto Café" width="52" height="52"><div><strong>Culto</strong><small id="mode">Simulador conversacional</small></div><button id="reset" type="button">Reiniciar</button></header>
<div id="log" role="log" aria-live="polite" aria-label="Conversación"></div>
<footer><div class="chips" aria-label="Ideas para empezar"><button type="button">Trabajar con Wi-Fi y enchufe</button><button type="button">Terraza tranquila con mi perro</button><button type="button">Brunch vegano</button></div><form><input required maxlength="500" aria-label="Tu mensaje" placeholder="Escribe tu mensaje…" autocomplete="off"><button>Enviar</button></form></footer>
</section></main><script type="module" src="./app.js"></script></body></html>
